# Wrangler configuration for deploying KURTIE to Cloudflare Workers.
#
# This project uses TanStack Start + Nitro's Cloudflare preset. After
# `bun run build`, Nitro emits:
#   - Worker bundle:  dist/server/index.mjs
#   - Static assets:  dist/client/
#   - Merged config:  dist/server/wrangler.json   (Nitro auto-generates)
#   - Deploy pointer: .wrangler/deploy/config.json
#
# Nitro OWNS `main` and `[assets]` — do NOT set them here (it ignores them
# and emits a warning). Settings below are merged INTO the generated
# dist/server/wrangler.json at build time.
#
# Deploy:
#   bun run build
#   bunx wrangler deploy
#
# Wrangler auto-discovers .wrangler/deploy/config.json which points at the
# generated dist/server/wrangler.json — no extra flags needed.
#
# Local preview against the built worker:
#   bunx wrangler dev

name = "kurtie"
compatibility_date = "2025-05-01"
compatibility_flags = ["nodejs_compat"]

# Observability — view logs in the Cloudflare dashboard.
[observability]
enabled = true

# ---------------------------------------------------------------------------
# Runtime secrets — set with:  bunx wrangler secret put <NAME>
#   - SUPABASE_URL
#   - SUPABASE_PUBLISHABLE_KEY
#   - SUPABASE_SERVICE_ROLE_KEY
#   - LOVABLE_API_KEY        (only if using Lovable AI Gateway)
#
# Build-time VITE_* vars are baked in from your local .env during
# `bun run build`. Ensure VITE_SUPABASE_URL, VITE_SUPABASE_PUBLISHABLE_KEY
# and VITE_SUPABASE_PROJECT_ID are set before building.
# ---------------------------------------------------------------------------

# [vars]
# PUBLIC_SITE_NAME = "KURTIE"

# ---------------------------------------------------------------------------
# Optional: custom domain routing. Add once your zone is on Cloudflare.
# ---------------------------------------------------------------------------
# routes = [
#   { pattern = "kurtie.com", custom_domain = true },
#   { pattern = "www.kurtie.com", custom_domain = true },
# ]

# ---------------------------------------------------------------------------
# Environments — deploy with:  bunx wrangler deploy --env production
# ---------------------------------------------------------------------------
[env.production]
name = "kurtie"

[env.staging]
name = "kurtie-staging"
